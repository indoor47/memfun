[project]
name = "memfun"
version = "0.3.0"
description = "OSS autonomous coding agent: pluggable runtime + DSPy RLM + MCP + Agent Skills"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Memfun Contributors"}]
keywords = ["ai", "agent", "coding", "dspy", "rlm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/indoor47/memfun"
Repository = "https://github.com/indoor47/memfun"
Issues = "https://github.com/indoor47/memfun/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# Resolver-only pins that hold transitive/dev deps back from releases that break us.
constraint-dependencies = [
    "fastmcp<4",  # 4.x unverified (it removed mount(prefix=...); gateway.py now uses namespace=); lift after a live tool-discovery check on 4.x
    "ruff<0.16",  # 0.16 also formats ```python blocks in Markdown: `ruff format --check` fails on skills/{generate-tests,refactor}/SKILL.md; migrate by reformatting (or excluding) those docs in a separate PR
    "filelock>=4.2.1",  # security floor: filelock<4.2.1 has 13 advisories (CVE-2026-112907..112940); forces litellm below 1.108 (which caps filelock<4.0); drop once litellm allows filelock 4
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "aiosqlite>=0.20",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = ["Makefile"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# evals/ depends heavily on untyped third-party libs (dspy, swebench, datasets);
# strict mode produces hundreds of unactionable errors. Excluded from CI typecheck.
# A custom `exclude` REPLACES pyright's defaults (**/node_modules,
# **/__pycache__, **/.*), so they must be restated here. Without `**/.*`
# pyright analyses all of .venv/site-packages (~13.8k files) and hangs.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "evals",
    ".claude/worktrees",
    ".memfun/worktrees",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/*/tests"]
