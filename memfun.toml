[project]
name = "memfun"

[llm]
provider = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# Per-role models (optional; see docs/configuration.md). Without any
# [llm.roles.*] table every role uses [llm].
#
# Swarm default: ALL roles (orchestrator, decomposer, worker, auditor,
# reviewer) on Qwen3.8-27B served by an OpenAI-compatible server (SGLang)
# behind an SSH tunnel -- no Anthropic key needed. Replace the [llm] table
# above with this; every role inherits it:
#
# [llm]
# provider = "openai"
# model = "qwen3.8-27b"
# base_url = "http://127.0.0.1:18000/v1"
# api_key_env = "MEMFUN_WORKER_API_KEY"
#
# [llm.roles.worker]        # optional per-role tuning
# max_tokens = 16384
#
# Optional comparison arm (NOT the default): Claude Opus 5.5 as
# orchestrator + decomposer, everything else stays on Qwen.
#
# [llm.roles.orchestrator]
# provider = "anthropic"
# model = "claude-opus-5-5"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [llm.roles.decomposer]
# provider = "anthropic"
# model = "claude-opus-5-5"
# api_key_env = "ANTHROPIC_API_KEY"

[backend]
tier = "sqlite"
sqlite_path = ".memfun/memfun.db"

[sandbox]
backend = "local"
